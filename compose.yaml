name: invest4fun

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: invest4fun
      POSTGRES_USER: invest4fun
      POSTGRES_PASSWORD: invest4fun
    ports:
      - "5432:5432"
    volumes:
      - invest4fun_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U invest4fun -d invest4fun"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build: .
    command: npm run db:migrate
    environment:
      DATABASE_URL: postgresql://invest4fun:invest4fun@postgres:5432/invest4fun
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      target: api
    environment:
      API_PORT: 8787
      DATABASE_URL: postgresql://invest4fun:invest4fun@postgres:5432/invest4fun
    ports:
      - "8787:8787"
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    build:
      context: .
      target: worker
    environment:
      DATABASE_URL: postgresql://invest4fun:invest4fun@postgres:5432/invest4fun
      WORKER_POLL_INTERVAL_MS: 30000
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: .
      target: web
    environment:
      API_ORIGIN: http://api:8787
    ports:
      - "5173:5173"
    depends_on:
      - api

  landing-page:
    build:
      context: .
      target: landing-page
    ports:
      - "4321:4321"

volumes:
  invest4fun_postgres:
